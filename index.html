<meta name="claude:viewport-fit-sides" content="cover"><title>Doodle Ludo</title>
<style>:root{color-scheme:light}</style>
<style>
/* Doodle Ludo UI */
.dl-root{--ink:#2b2438;--paper:#fbf5e4;--paper2:#f3e9cc;--red:#e2564c;--green:#58b85a;--yellow:#f2c53d;--blue:#4a8fd8;

  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;z-index:10;overflow:hidden;

.dl-root *,.dl-root *::before,.dl-root *::after{box-sizing:border-box}

.dl-root.dl-backdrop::before{content:"";position:absolute;inset:0;pointer-events:auto;

.dl-screen.dl-top{z-index:5;background:rgba(43,36,56,.35);pointer-events:auto}
.dl-screen.dl-over-hud,.dl-pause{background:rgba(43,36,56,.3);pointer-events:auto}
.dl-over{background:rgba(43,36,56,.35);pointer-events:auto}
.dl-card{pointer-events:auto;position:relative;width:min(440px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:auto;
  background:var(--paper);background-image:repeating-linear-gradient(transparent 0 27px,rgba(74,143,216,.16) 27px 28px),linear-gradient(90deg,transparent 0 44px,rgba(226,86,76,.28) 44px 46px,transparent 46px);
  border:3px solid var(--ink);border-radius:26px 18px 28px 16px/18px 28px 16px 26px;padding:22px 20px 20px 20px;
  box-shadow:5px 6px 0 var(--ink),0 18px 40px rgba(43,36,56,.35);animation:dl-pop .45s cubic-bezier(.3,1.5,.5,1) both;transform:rotate(-.4deg)}
.dl-card.dl-wide{width:min(520px,100%)}.dl-card.dl-small{width:min(340px,100%)}
@keyframes dl-pop{from{opacity:0;transform:translateY(24px) scale(.92) rotate(2deg)}}
.dl-h2{font-family:var(--head);font-weight:400;font-size:2rem;margin:0;letter-spacing:.5px;text-shadow:2px 2px 0 var(--yellow)}
.dl-h3{font-family:var(--head);font-weight:400;font-size:1.3rem;margin:14px 0 6px}
.dl-center{text-align:center}
.dl-head{display:flex;align-items:center;gap:12px;margin:0 0 8px 0}
.dl-sub{margin:4px 0 12px;opacity:.75;font-size:1rem}
/* buttons */
.dl-btn{font:inherit;font-family:var(--head);font-size:1.25rem;color:var(--ink);cursor:pointer;pointer-events:auto;position:relative;
  background:#fff;border:3px solid var(--ink);border-radius:16px 12px 18px 11px/12px 18px 11px 16px;padding:10px 18px;min-height:46px;
  box-shadow:3px 4px 0 var(--ink);transform:rotate(var(--r,0deg));transition:transform .12s,box-shadow .12s,background .15s;touch-action:manipulation}

.dl-btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.dl-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink)}
.dl-btn:focus-visible,.dl-segbtn:focus-visible,.dl-switch:focus-visible,.dl-name:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
.dl-primary{background:var(--yellow)}.dl-primary:hover{background:#ffd24e}
.dl-green{background:#9bdc8a}.dl-red{background:#ff9a8f}
.dl-big{font-size:1.7rem;padding:12px 26px;min-height:58px}
.dl-sm{font-size:1.1rem;padding:8px 14px;min-height:44px}
.dl-icon{width:48px;height:48px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;flex:none}
.dl-btn span{pointer-events:none}
/* title */

.dl-ch{display:inline-block;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink);animation:dl-bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.22s)}
.dl-ch.c0{color:var(--red)}.dl-ch.c1{color:var(--green)}.dl-ch.c2{color:var(--yellow)}.dl-ch.c3{color:var(--blue)}

.dl-doodledice{display:flex;gap:6px;justify-content:center;margin:4px 0}

.dl-menu2{display:flex;gap:8px}.dl-menu2 .dl-btn{flex:1;padding:8px 6px;font-size:1.05rem}
.dl-title .dl-play{}

.dl-segbtn{font:inherit;font-family:var(--head);font-size:1rem;color:var(--ink);background:transparent;border:0;border-right:2px solid var(--ink);padding:7px 11px;cursor:pointer;min-height:44px;touch-action:manipulation}
.dl-segbtn:last-child{border-right:0}
.dl-segbtn[aria-checked=true]{background:var(--yellow)}

.dl-danger{margin-top:8px}
/* setup seats */
.dl-seats{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}

.dl-tok{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;flex:none;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.dl-sym{font-style:normal;font-size:.9em;margin-right:5px;display:none;line-height:1}
.dl-cb .dl-sym{display:inline-block}.dl-tok .dl-sym{margin:0;color:#fff;-webkit-text-stroke:1px var(--ink);font-size:1.15rem}
.dl-seat .dl-tok .dl-sym{display:inline-block}
.dl-name{font:inherit;font-family:var(--head);font-size:1.15rem;color:var(--ink);background:rgba(255,255,255,.75);border:2px solid var(--ink);border-radius:10px 8px 11px 8px;padding:6px 8px;min-width:0;flex:1;height:44px;-webkit-user-select:text;user-select:text;pointer-events:auto}

.dl-seg3 .dl-segbtn{padding:7px 8px;font-size:.95rem}
@media(max-width:400px){.dl-seat{flex-wrap:wrap}.dl-seat .dl-name{flex:1 1 60%}.dl-seg3{width:100%}.dl-seg3 .dl-segbtn{flex:1}}
.dl-c-red{--c:var(--red)}.dl-c-green{--c:var(--green)}.dl-c-yellow{--c:var(--yellow)}.dl-c-blue{--c:var(--blue)}
.dl-foot{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
/* rules */
.dl-rules{list-style:none;margin:6px 0 8px;padding:0;display:flex;flex-direction:column;gap:9px}
.dl-rule{display:flex;gap:10px;align-items:flex-start;transform:rotate(var(--r,0))}

.dl-bars{display:flex;flex-direction:column;gap:6px}

.dl-barfill{display:block;height:100%;background:var(--c);border-right:2.5px solid var(--ink);transition:width .6s}
.dl-bar b{font-family:var(--head);font-weight:400;text-align:right}

.dl-confirm{font-family:var(--head);font-size:1.3rem;text-align:center;margin:4px 0 16px}
.dl-confrow{display:flex;gap:10px;justify-content:center}

.dl-hud{position:absolute;inset:0;pointer-events:none;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.dl-hudtop{display:flex;flex-direction:column;gap:2px;min-width:0}

.dl-banner{--c:#999;pointer-events:none;display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:18px 12px 20px 12px;padding:6px 14px 6px 10px;box-shadow:3px 4px 0 var(--ink);animation:dl-slide .35s cubic-bezier(.3,1.5,.5,1);position:relative;max-width:calc(100% - 62px);min-width:0}
.dl-banner::before{content:"";width:26px;height:26px;flex:none;border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.dl-banner .dl-dot{display:none}
.dl-btxt{display:flex;flex-direction:column;line-height:1.05;min-width:0}.dl-btxt b{font-family:var(--head);font-weight:400;font-size:1.45rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl-btxt small{font-size:.9rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-bigbanner{padding:7px 16px 7px 10px;background:color-mix(in srgb,var(--c) 22%,var(--paper))}.dl-bigbanner .dl-btxt b{font-size:1.65rem}

.dl-cb .dl-btxt .dl-sym{display:block}
.dl-think{display:inline-flex;gap:3px;margin-left:4px}.dl-think i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:dl-dots 1s infinite}.dl-think i:nth-child(2){animation-delay:.15s}.dl-think i:nth-child(3){animation-delay:.3s}
@keyframes dl-dots{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes dl-slide{from{transform:translateY(-14px) rotate(-3deg);opacity:0}}
.dl-pausebtn{pointer-events:auto;font-size:.9rem;letter-spacing:-2px}
.dl-chips{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;pointer-events:auto;touch-action:pan-x;position:relative;margin:0 -12px;padding:8px 14px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.dl-chips::-webkit-scrollbar{display:none}
.dl-chips:empty{display:none}
.dl-chips>.dl-chip:first-child{margin-left:auto}.dl-chips>.dl-chip:last-child{margin-right:auto}
.dl-chip{--c:#999;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;background:color-mix(in srgb,var(--c) 35%,#fff);border:2.5px solid var(--ink);border-radius:13px 9px 14px 9px;font-size:.9rem;opacity:.85;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;max-width:130px}
.dl-chipname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;font-family:var(--head);display:inline-flex;align-items:center}
.dl-chip .dl-sym{margin-right:3px}
.dl-cdot{--c:#999;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--c);border:2px solid var(--ink);margin-right:4px;flex:none;font-style:normal}
.dl-cdot .dl-sym{display:none;margin:0;font-size:8px;color:#fff;-webkit-text-stroke:.3px var(--ink)}.dl-cb .dl-cdot .dl-sym{display:block}
.dl-cmp .dl-chip{padding:3px 7px;font-size:.82rem;max-width:92px}.dl-cmp .dl-chipname{max-width:74px}.dl-cmp .dl-pips i{width:7px;height:7px;border-width:1.5px}.dl-cmp .dl-pips{gap:2px}
.dl-team{max-width:none}.dl-team .dl-chipname{max-width:none;gap:0}.dl-team .dl-chipname b{font-weight:400;margin-left:3px;font-size:1rem}
.dl-tbar{display:block;width:100%;height:8px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden}.dl-tbar i{display:block;height:100%;background:var(--ink);transition:width .4s}
.dl-active{opacity:1;transform:scale(1.1) translateY(1px);box-shadow:2px 3px 0 var(--ink);background:var(--c);animation:dl-pulse 1.6s ease-in-out infinite}
.dl-won{opacity:.6;filter:grayscale(.5)}
@keyframes dl-pulse{50%{transform:scale(1.15) translateY(1px) rotate(-1.5deg)}}
.dl-pips{display:flex;gap:3px}.dl-pips i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:#fff}.dl-pips i.on{background:var(--ink)}

@keyframes dl-hint{50%{transform:translateY(-6px) rotate(1deg)}}@keyframes dl-bounce{50%{transform:translateY(4px)}}
/* toasts */
.dl-toasts{position:absolute;left:12px;right:12px;top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20}
.dl-toast{font-family:var(--head);font-size:1.2rem;background:var(--paper);border:3px solid var(--ink);border-radius:15px 10px 16px 10px;padding:7px 16px;box-shadow:3px 4px 0 var(--ink);transform:rotate(var(--r,0));animation:dl-toast .4s cubic-bezier(.3,1.6,.5,1);max-width:100%;text-align:center}
.dl-toast.rep{animation:dl-toast .4s cubic-bezier(.3,1.6,.5,1)}
.dl-toast.out{opacity:0;transform:translateY(-12px);transition:.3s}
.dl-t-good{background:#c9f0bf}.dl-t-bad{background:#ffc2ba}.dl-t-warn{background:#ffe9a0}
@keyframes dl-toast{from{opacity:0;transform:translateY(-16px) scale(.8) rotate(3deg)}}

.dl-win{font-size:2.4rem;animation:dl-bob 1.5s infinite}

.dl-pod{--c:#999;display:flex;flex-direction:column;align-items:center;flex:1;max-width:120px}
.dl-pawn{position:relative;width:48px;height:48px;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:inset -5px -5px 0 rgba(0,0,0,.18),2px 3px 0 var(--ink);animation:dl-hop 1.4s ease-in-out infinite}
.dl-pawn .dl-sym{display:none}.dl-cb .dl-pawn .dl-sym{display:inline;color:#fff;margin:0;font-size:1.3rem}

.dl-place2 .dl-pawn{animation-delay:.2s}.dl-place3 .dl-pawn{animation-delay:.4s}

.dl-pod{animation:dl-rise .6s cubic-bezier(.3,1.4,.5,1) both}.dl-place2{animation-delay:.15s}.dl-place1{animation-delay:.3s}.dl-place3{animation-delay:.05s}

.dl-rest li{--c:#999;display:flex;gap:8px;align-items:center;font-size:1rem;padding:3px 8px;background:color-mix(in srgb,var(--c) 22%,#fff);border:2px solid var(--ink);border-radius:11px 8px 12px 8px}
.dl-rest b{font-family:var(--head);font-weight:400;min-width:2.6em}.dl-rest small{margin-left:auto;opacity:.7;white-space:nowrap}.dl-rname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dl-rdot{flex:none;width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid var(--ink);display:grid;place-items:center}.dl-rdot .dl-sym{display:none;margin:0;font-size:10px;color:#fff}.dl-cb .dl-rdot .dl-sym{display:block}
.dl-tiles3{margin-top:12px}
.dl-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dl-confetti i{position:absolute;top:-16px;width:10px;height:14px;border:2px solid var(--ink);animation:dl-fall 3.2s linear infinite;border-radius:2px}
.dl-confetti i.c0{background:var(--red)}.dl-confetti i.c1{background:var(--green)}.dl-confetti i.c2{background:var(--yellow)}.dl-confetti i.c3{background:var(--blue)}
@keyframes dl-fall{to{transform:translate(var(--dx),calc(100vh)) rotate(540deg)}}
/* reduced motion */
.dl-rm *,.dl-rm *::before,.dl-rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.dl-root *,.dl-root *::before,.dl-root *::after{animation:none!important;transition:none!important}}
/* beta setup */
.dl-badge{display:inline-block;font-family:var(--font);font-size:.7rem;letter-spacing:1px;padding:1px 6px;margin-left:4px;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;transform:rotate(-4deg);vertical-align:middle}
.dl-betapanel{margin:4px 0 6px;padding:2px 10px 8px;background:rgba(255,255,255,.55);border:3px dashed var(--ink);border-radius:16px 12px 17px 12px;pointer-events:auto}
.dl-stepper{display:inline-flex;align-items:center;gap:6px;flex:none}
.dl-stepbtn{font:inherit;font-family:var(--head);font-size:1.5rem;line-height:1;width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;background:#fff;color:var(--ink);cursor:pointer;box-shadow:2px 3px 0 var(--ink);touch-action:manipulation;padding:0}
.dl-stepbtn:active{transform:translate(2px,3px);box-shadow:none}.dl-stepbtn:disabled{opacity:.4;cursor:not-allowed}.dl-stepbtn:focus-visible,.dl-range:focus-visible,.dl-namessum:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
.dl-stepval{min-width:2.2ch;text-align:center;font-family:var(--head);font-size:1.7rem}
.dl-sliderwrap{padding:0 6px;margin:-2px 0 4px}
.dl-range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
.dl-range::-webkit-slider-runnable-track{height:12px;border:3px solid var(--ink);border-radius:8px;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green),var(--blue))}
.dl-range::-moz-range-track{height:8px;border:3px solid var(--ink);border-radius:8px;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green),var(--blue))}
.dl-range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:2px 3px 0 var(--ink)}
.dl-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:2px 3px 0 var(--ink)}
.dl-names{border-top:2px dashed rgba(43,36,56,.25);padding-top:4px}
.dl-namessum{font-family:var(--head);font-size:1.15rem;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;list-style:none}
.dl-namessum::-webkit-details-marker{display:none}.dl-namessum::before{content:"▸";transition:transform .2s}.dl-names[open] .dl-namessum::before{transform:rotate(90deg)}
.dl-namessum small{opacity:.6;font-family:var(--font)}
.dl-namelist{display:flex;flex-direction:column;gap:6px;padding:2px 2px 6px}
.dl-nrow{--c:#999;display:flex;align-items:center;gap:8px}
.dl-ndot{flex:none;position:relative;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;font-style:normal}
.dl-ndot em{font-style:normal;font-family:var(--head);font-size:.95rem;color:#fff;-webkit-text-stroke:.6px var(--ink);paint-order:stroke fill}.dl-ndot .dl-sym{display:none}
.dl-ntype{flex:none;font-size:.85rem;opacity:.65;width:3.6em}
.dl-name::placeholder{color:rgba(43,36,56,.5)}
.dl-betarow{margin-top:4px}
/* landscape / short */
@media(max-width:360px){.dl-card{padding:18px 14px 16px 14px}.dl-card{background-image:repeating-linear-gradient(transparent 0 27px,rgba(74,143,216,.16) 27px 28px)}.dl-screen{padding:10px}.dl-rowseg .dl-seg{width:100%}.dl-rowseg .dl-segbtn{flex:1}}
@media (max-height:520px){.dl-card{padding:14px 16px}.dl-h2{font-size:1.6rem}.dl-logoword{font-size:3rem!important}.dl-logoword+.dl-logoword{font-size:2.6rem!important;margin-top:-4px}.dl-tag{display:none}.dl-big{min-height:48px;font-size:1.4rem}.dl-podium{min-height:140px;margin:8px 0}.dl-rules{gap:5px}.dl-btxt b{font-size:1.2rem!important}.dl-chips{padding-top:4px;padding-bottom:8px}}
@media (max-height:520px) and (min-width:560px){.dl-titlecard{width:min(560px,100%)}.dl-menu{flex-direction:row;flex-wrap:wrap}.dl-menu>.dl-btn{flex:1}.dl-menu2{flex:1 1 100%}}
@media (min-width:700px){.dl-hud{padding-left:20px;padding-right:20px}.dl-chips{margin:0 -20px;padding-left:22px;padding-right:22px}.dl-chips>.dl-chip:first-child{margin-left:0}.dl-chips>.dl-chip:last-child{margin-right:auto}.dl-hud .dl-top{justify-content:flex-start}.dl-banner{max-width:calc(100% - 70px)}}
.dl-confirming .dl-pause .dl-card{visibility:hidden}

.dl-fxbtn{pointer-events:auto;font-size:.8rem!important;letter-spacing:0;min-width:46px;padding:6px 10px!important}
.dl-topr{display:flex;gap:8px;align-items:flex-start;pointer-events:none}

    if (!R || !R.state || R.state.phase === 'over') return;
    var p = R.state.current, pl = R.state.players[p];
    if (pl.type === 'human' && pl.uid !== uid && Date.now() - R.lastChange > 50000) {
      pl.type = 'bot'; pl.difficulty = 'normal'; toast(pl.name + ' timed out; a bot takes over', 'warn'); push({ kind: 'sync' }); wake();
    }
  }
  function push(ev) {
    var r = R; if (!r) return; r.seq++; var d = { seq: r.seq, state: JSON.stringify(r.state), ev: ev }; r.lastChange = Date.now();
    r.wq = r.wq.then(function () { return db.doc('rooms/' + r.code + '/game/state').set(d); }).catch(function () {});
  }
  function wake() { if (R && R.wake) { var w = R.wake; R.wake = null; w(); } }

  async function animate(evs) {
    var sc = ctx.scene, UI = ctx.UI;
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      if (e.type === 'capture') { audio('capture'); UI.toast('Captured!', { kind: 'bad' }); await sc.captureToken(e.victim, e.victimToken); }
      else if (e.type === 'finish') { audio('finishToken'); await sc.finishToken(e.player, e.tokenIdx); }
      else if (e.type === 'extraTurn') { UI.toast('Roll again!', { kind: 'good' }); sc.fx && sc.fx('extra'); }
      else if (e.type === 'forfeit') { UI.toast('Three 6s! Turn lost', { kind: 'warn' }); sc.fx && sc.fx('forfeit'); }
      else if (e.type === 'noMoves') { UI.toast('No moves', { kind: 'warn' }); audio('error'); }
    }
  }
  async function applyRemote(d) {
    var r = R; if (!r) return; var ev = d.ev || {}, sc = ctx.scene;
    r.state = JSON.parse(d.state); r.seq = d.seq; r.lastChange = Date.now();
    if (ev.kind === 'roll') { audio('diceShake'); await sc.rollDice(ev.value); audio('diceLand'); await animate((ev.events || []).filter(function (e) { return e.type === 'forfeit' || e.type === 'noMoves'; })); }
    else if (ev.kind === 'move') { audio(ev.from === -1 ? 'enter' : 'hop'); await sc.moveToken(ev.own, ev.t, ev.from, ev.to); await animate(ev.events || []); }
    else if (ev.kind === 'sync') sc.loadState(r.state);
    if (R !== r) return; ctx.UI.updateHUD(r.state); wake();
  }
  async function loop(id) {
    var sc = ctx.scene, UI = ctx.UI;
    while (id === runId && R) {
      var st = R.state;
      if (st.phase === 'over') return over(id);
      var p = st.current, pl = st.players[p], mine = pl.type === 'human' && pl.uid === uid, drive = pl.type === 'bot' && R.host;
      sc.setCurrent(p); UI.updateHUD(st);
      if (!(mine || drive)) { await new Promise(function (res) { R.wake = res; }); continue; }
      if (mine) {
        UI.setRollHint(true); sc.setDiceActive(true);
        await new Promise(function (res) { sc.onDiceClick(function () { res(); }); });
        sc.setDiceActive(false); UI.setRollHint(false);
      } else { UI.setThinking(true); await sleep(800); UI.setThinking(false); }
      if (id !== runId || !R) return;
      audio('diceShake');
      var r = L.rollDie(st);
      push({ kind: 'roll', value: r.value, events: r.events });
      await sc.rollDice(r.value); audio('diceLand'); if (r.value === 6) audio('six');
      await animate(r.events.filter(function (e) { return e.type === 'forfeit' || e.type === 'noMoves'; }));
      if (id !== runId || !R) return;
      if (st.phase !== 'move') { await sleep(300); continue; }
      var moves = L.legalMoves(st), mv;
      if (mine && moves.length > 1) { UI.toast('Move yours or your partner’s', { kind: 'good', ms: 1400 }); mv = await new Promise(function (res) { sc.showMovable(moves, res); }); sc.clearMovable(); }
      else { if (!mine) await sleep(400); mv = mine ? moves[0] : L.botChooseMove(st, moves, pl.difficulty || 'normal'); }
      if (id !== runId || !R) return;
      var from = mv.from, to = mv.to, t = mv.tokenIdx, own = mv.player !== undefined ? mv.player : p;
      var res = L.applyMove(st, mv);
      push({ kind: 'move', own: own, t: t, from: from, to: to, events: res.events });
      audio(from === -1 ? 'enter' : 'hop');
      await sc.moveToken(own, t, from, to); await animate(res.events);
      UI.updateHUD(st); await sleep(200);
    }
  }
  async function over(id) {
    var r = R, st = r.state; try { G.Audio.stopMusic(); } catch (e) {}
    await sleep(900); if (R !== r) return;
    if (ctx.scene.celebrateWinner) ctx.scene.celebrateWinner(st.winners[0]);
    var seats = mySeats(), winTeam = st.winners[0] % 2;
    if (seats.length && !r.recorded) {
      r.recorded = true; var won = seats[0] % 2 === winTeam;
      try {
        var d = db.doc('lb/' + uid), s = await d.get(), x = s.exists ? s.data() : {};
        await d.set({ name: myName, wins: (x.wins | 0) + (won ? 1 : 0), games: (x.games | 0) + 1, t: Date.now() });
        toast(won ? 'Your team wins! Leaderboard updated' : 'Game recorded on the leaderboard', won ? 'good' : 'info');
      } catch (e) {}
    }
    await sleep(900); if (R !== r) return;
    var mate = (st.winners[0] + 2) % 4, winners = st.players[st.winners[0]].name + ' & ' + st.players[mate].name;
    open(function (c) {
      c.appendChild(heading('Team ' + (winTeam === 0 ? 'Red + Yellow' : 'Green + Blue') + ' wins!'));
      c.appendChild(el('p', 'dl-sub dl-center', esc(winners) + ' got all 8 tokens home.'));
      var f = el('div', 'dl-foot'); f.appendChild(btn('Leaderboard', 'dl-sm', showBoard)); f.appendChild(btn('Back to menu', 'dl-primary', function () { leave(true); close(); ctx.UI.show('title'); })); c.appendChild(f);
    });
  }

  G.Net = {
    init: function (c) { ctx = c; },
    showOnline: showOnline, showBoard: showBoard,
    active: function () { return !!(R && R.started); },
    quit: function () { leave(true); close(); }
  };
})();

/* main */
(function () {
  var G = window.LudoGame, L = G.Logic, S = G.Storage, UI = G.UI;
  var state, runId = 0, paused = false, cfgLast = null, sum = { captures: 0, sixes: 0, turns: 0 }, scene;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function speed() { var s = UI.getSettings().botSpeed; return s === 'fast' ? 0.35 : s === 'slow' ? 1.6 : 1; }
  function audio(n, o) { try { G.Audio && G.Audio.play(n, o); } catch (e) {} }
  function save() { if (state && state.phase !== 'over') S.saveGame({ state: state, sum: sum, cfg: cfgLast }); }
  async function gate(id) { while (paused && id === runId) await sleep(100); return id === runId; }

  function applyView(instant) {
    if (!scene || !state || !scene.setViewMode) return;
    var mode = (UI.getSettings().rotate || 'auto'), hs = [];
    state.players.forEach(function (p, i) { if (p && p.type === 'human') hs.push(i); });
    if (mode === 'off') scene.setViewMode('fixed', 0, instant);
    else if (mode === 'turn' || (hs.length > 1)) scene.setViewMode('turn', 0, instant);
    else if (hs.length === 1) scene.setViewMode('seat', hs[0], instant);
    else scene.setViewMode('fixed', 0, instant);
  }
  G.applyView = applyView;
  function begin(newState, cfg, summary) {
    runId++; paused = false; state = newState; cfgLast = cfg; sum = summary || { captures: 0, sixes: 0, turns: 0 };
    UI.hideAll(); UI.show('hud'); scene.loadState(state); applyView(true); UI.updateHUD(state);
    try { G.Audio.startMusic(); } catch (e) {}
    loop(runId);
  }
  function startFromConfig(cfg) {
    if (cfg.beta) { begin(L.newGame({ players: cfg.players, seed: cfg.seed, beta: true }), cfg); return; }
    var seats = [], players = [];
    cfg.players.forEach(function (p, i) { if (p) { seats.push(i); players.push(p); } });
    begin(L.newGame({ players: players, seats: seats, seed: cfg.seed, coop: cfg.coop }), cfg);
  }
  async function animateEvents(evs) {
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      if (e.type === 'capture') {
        sum.captures++; audio('capture'); UI.toast('Captured!', { kind: 'bad' });
        await scene.captureToken(e.victim, e.victimToken);
      } else if (e.type === 'finish') { audio('finishToken'); await scene.finishToken(e.player, e.tokenIdx); }
      else if (e.type === 'extraTurn') { UI.toast('Roll again!', { kind: 'good' }); scene.fx && scene.fx('extra'); }
      else if (e.type === 'forfeit') { UI.toast('Three 6s! Turn lost', { kind: 'warn' }); scene.fx && scene.fx('forfeit'); }
      else if (e.type === 'noMoves') { UI.toast('No moves', { kind: 'warn' }); audio('error'); }
      else if (e.type === 'win') UI.toast(e.team ? 'Team win!' : (state.players[e.player].name) + ' got all home!', { kind: 'good' });
    }
  }
  async function loop(id) {
    while (id === runId) {
      if (state.phase === 'over') return finish(id);
      if (!(await gate(id))) return;
      var p = state.current, human = state.players[p].type === 'human';
      scene.setCurrent(p); UI.updateHUD(state); save();
      if (human) {
        UI.setRollHint(true); scene.setDiceActive(true);
        await new Promise(function (res) { scene.onDiceClick(function () { res(); }); });
        scene.setDiceActive(false); UI.setRollHint(false);
        if (id !== runId) return;
        if (!(await gate(id))) return;
      } else { UI.setThinking(true); await sleep(700 * speed()); UI.setThinking(false); if (id !== runId) return; }
      audio('diceShake');
      var r = L.rollDie(state); sum.turns++;
      if (r.value === 6) { sum.sixes++; }
      await scene.rollDice(r.value); audio('diceLand'); if (r.value === 6) audio('six');
      if (id !== runId) return;
      await animateEvents(r.events.filter(function (e) { return e.type === 'forfeit' || e.type === 'noMoves'; }));
      if (state.phase !== 'move') { await sleep(300 * speed()); continue; }
      var moves = L.legalMoves(state), mv;
      if (human && state.coop) UI.toast('Move yours or your partner’s', { kind: 'good', ms: 1400 });
      if (human && moves.length > 1) {
        mv = await new Promise(function (res) { scene.showMovable(moves, res); });
        scene.clearMovable();
      } else {
        if (!human) await sleep(350 * speed());
        mv = human ? moves[0] : L.botChooseMove(state, moves, state.players[p].difficulty || 'normal');
      }
      if (id !== runId) return;
      var from = mv.from, to = mv.to, t = mv.tokenIdx, own = mv.player !== undefined ? mv.player : p;
      var res = L.applyMove(state, mv);
      audio(from === -1 ? 'enter' : 'hop', { step: 0 });
      await scene.moveToken(own, t, from, to);
      if (mv.isSafeLanding && from !== -1) audio('safe');
      await animateEvents(res.events);
      UI.updateHUD(state); save();
      await sleep(200 * speed());
    }
  }
  function finish(id) {
    S.clearGame();
    try { G.Audio.stopMusic(); } catch (e) {}
    scene.celebrateWinner && scene.celebrateWinner(state.winners[0]);
    sleep(1400).then(function () { if (id === runId) UI.showGameOver(state, sum); });
  }

  document.addEventListener('keydown', function (e) { if (e.code === 'Space' && scene && !(e.target && /INPUT|BUTTON|TEXTAREA/.test(e.target.tagName))) { if (scene.triggerRoll && scene.triggerRoll()) e.preventDefault(); } });
  function init() {
    scene = G.Scene.create(document.getElementById('c'));
    UI.init(document.getElementById('ui'), {
      onStart: startFromConfig,
      onContinue: function () { var g = S.loadGame(); if (g && g.state) begin(g.state, g.cfg, g.sum); },
      onResume: function () { paused = false; UI.show('hud'); },
      onPause: function () { paused = true; },
      onRestart: function () { if (cfgLast) startFromConfig({ beta: cfgLast.beta, n: cfgLast.n, players: cfgLast.players, coop: cfgLast.coop, seed: Math.floor(Math.random() * 1e9) }); },
      onQuit: function () { if (G.Net.active()) { G.Net.quit(); UI.show('title'); return; } runId++; paused = false; save(); try { G.Audio.stopMusic(); } catch (e) {} UI.show('title'); },
      onOnline: function () { G.Net.showOnline(); }, onLeaderboard: function () { G.Net.showBoard(); },
      onSettingsChange: function (s) { applyView(); try { G.Audio.setMuted(!s.sound); G.Audio.setMusic(s.music); } catch (e) {} }
    });
    G.Net.init({ scene: scene, UI: UI }); G.Battle && G.Battle.init(scene);
    UI.show('title');
  }
  window.addEventListener('DOMContentLoaded', init);
})();
</script>
